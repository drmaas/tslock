name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reject an unparseable pnpm-lock.yaml
        run: node --test scripts/validate-lockfile.test.mjs scripts/create-signed-commit.test.mjs scripts/check-exports.test.mjs && node scripts/validate-lockfile.mjs
      - name: Enable pnpm
        run: npm install -g corepack@latest && corepack enable
      - name: Fail if the lockfile is out of date
        env:
          CI: true
        run: |
          if ! pnpm install --lockfile-only --frozen-lockfile; then
            echo "pnpm-lock.yaml failed frozen validation. verify and integration will not start."
            echo "Regenerate it with \`pnpm install\` and commit pnpm-lock.yaml. Do not leave duplicate package or snapshot keys."
            exit 1
          fi

  verify:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g corepack@latest && corepack enable && pnpm install --frozen-lockfile
        env:
          CI: true
      - run: pnpm audit --prod
        continue-on-error: true
      - run: pnpm check
      - run: pnpm build
      - run: pnpm check:exports
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    needs: lockfile
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g corepack@latest && corepack enable && pnpm install --frozen-lockfile
        env:
          CI: true
      - run: pnpm build
      - run: pnpm test:integration
        env:
          TSLOCK_REDIS_INTEGRATION: '1'
          REDIS_URL: redis://127.0.0.1:6379

  pack:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g corepack@latest && corepack enable && pnpm install --frozen-lockfile
        env:
          CI: true
      - run: pnpm build
      - run: pnpm check:packed-peers
      - name: Pack all workspace packages
        run: |
          mkdir -p /tmp/tslock-packs
          pnpm -r exec pnpm pack --pack-destination /tmp/tslock-packs
