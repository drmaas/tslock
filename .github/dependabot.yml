# npm ecosystem + pnpm-lock.yaml at the repo root covers the whole pnpm workspace.
# packageManager in package.json (pnpm@12.10.1) is what selects the pnpm updater.
# Dependabot's "VulnerabilityAuditor: missing lockfile" line only means the npm
# audit helper did not find package-lock.json. This repo does not commit one.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
